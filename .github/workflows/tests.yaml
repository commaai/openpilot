name: tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      run_number:
        default: '1'
        required: true
        type: string

concurrency:
  group: tests-ci-run-${{ inputs.run_number }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.run_id || github.head_ref || github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CI: 1
  PYTHONPATH: ${{ github.workspace }}
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: lfs.fetchexclude
  GIT_CONFIG_VALUE_0: openpilot/selfdrive/modeld/models/big_driving_supercombo.onnx

jobs:
  build_release:
    name: build release
    runs-on: ${{
      (github.repository == 'commaai/openpilot') &&
      ((github.event_name != 'pull_request') ||
      (github.event.pull_request.head.repo.full_name == 'commaai/openpilot'))
      && fromJSON('["namespace-profile-amd64-8x16"]')
      || fromJSON('["ubuntu-24.04"]') }}
    env:
      STRIPPED_DIR: /tmp/releasepilot
      PYTHONPATH: /tmp/releasepilot
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Getting LFS files
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
      with:
        timeout_minutes: 2
        max_attempts: 3
        command: git lfs pull
    - name: Build devel
      timeout-minutes: 1
      run: TARGET_DIR=$STRIPPED_DIR tools/release/build_stripped.sh
    - run: ./tools/op.sh setup
    - name: Build openpilot and run checks
      timeout-minutes: 30
      working-directory: ${{ env.STRIPPED_DIR }}
      run: python3 openpilot/system/manager/build.py
    - name: Run tests
      timeout-minutes: 1
      working-directory: ${{ env.STRIPPED_DIR }}
      run: tools/release/check-dirty.sh
    - name: Check submodules
      if: github.repository == 'commaai/openpilot'
      timeout-minutes: 3
      run: tools/release/check-submodules.sh

  build_mac:
    name: build macOS
    runs-on: ${{ ((github.repository == 'commaai/openpilot') && ((github.event_name != 'pull_request') || (github.event.pull_request.head.repo.full_name == 'commaai/openpilot'))) && 'namespace-profile-macos-8x14' || 'macos-latest' }}
    steps:
    - uses: actions/checkout@v7
    - name: Remove Homebrew from environment
      run: |
        FILTERED=$(echo "$PATH" | tr ':' '\n' | grep -v '/opt/homebrew' | tr '\n' ':')
        echo "PATH=${FILTERED}/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" >> $GITHUB_ENV
    - run: ./tools/op.sh setup
    - name: Building openpilot
      run: scons

  static_analysis:
    name: static analysis
    runs-on: ${{
      (github.repository == 'commaai/openpilot') &&
      ((github.event_name != 'pull_request') ||
      (github.event.pull_request.head.repo.full_name == 'commaai/openpilot'))
      && fromJSON('["namespace-profile-amd64-8x16"]')
      || fromJSON('["ubuntu-24.04"]') }}
    steps:
    - uses: actions/checkout@v7
    - run: ./tools/op.sh setup
    - name: Static analysis
      timeout-minutes: 1
      run: scripts/lint/lint.sh

  unit_tests:
    name: unit tests
    runs-on: ${{
      (github.repository == 'commaai/openpilot') &&
      ((github.event_name != 'pull_request') ||
      (github.event.pull_request.head.repo.full_name == 'commaai/openpilot'))
      && fromJSON('["namespace-profile-amd64-8x16"]')
      || fromJSON('["ubuntu-24.04"]') }}
    steps:
    - uses: actions/checkout@v7
    - run: ./tools/op.sh setup
    - name: Build openpilot
      run: scons
    - name: Run unit tests
      timeout-minutes: ${{ contains(runner.name, 'nsc') && 2 || 20 }}
      env:
        RAYLIB_BACKEND: headless
      run: tools/op.sh test

  process_replay:
    name: process replay
    runs-on: ${{
      (github.repository == 'commaai/openpilot') &&
      ((github.event_name != 'pull_request') ||
      (github.event.pull_request.head.repo.full_name == 'commaai/openpilot'))
      && fromJSON('["namespace-profile-amd64-8x16"]')
      || fromJSON('["ubuntu-24.04"]') }}
    steps:
    - uses: actions/checkout@v7
    - run: ./tools/op.sh setup
    - name: Build openpilot
      run: scons
    - name: Run replay
      timeout-minutes: ${{ contains(runner.name, 'nsc') && 2 || 20 }}
      continue-on-error: ${{ github.ref == 'refs/heads/master' }}
      run: openpilot/selfdrive/test/process_replay/test_processes.py -j$(nproc)
    - name: Print diff
      id: print-diff
      if: always()
      run: cat openpilot/selfdrive/test/process_replay/diff.txt
    - name: Print diff report
      if: always()
      run: cat openpilot/selfdrive/test/process_replay/diff_report.txt
    - uses: actions/upload-artifact@v7
      if: always()
      continue-on-error: true
      with:
        name: process_replay_diff.txt
        path: openpilot/selfdrive/test/process_replay/diff.txt
    - name: Upload diff report
      uses: actions/upload-artifact@v7
      if: always() && github.event_name == 'pull_request'
      continue-on-error: true
      with:
        name: diff_report_${{ github.event.number }}
        path: openpilot/selfdrive/test/process_replay/diff_report.txt
    - name: Checkout ci-artifacts
      if: github.repository == 'commaai/openpilot' && github.ref == 'refs/heads/master'
      uses: actions/checkout@v7
      with:
        repository: commaai/ci-artifacts
        ssh-key: ${{ secrets.CI_ARTIFACTS_DEPLOY_KEY }}
        path: ${{ github.workspace }}/ci-artifacts
    - name: Prepare refs
      if: github.repository == 'commaai/openpilot' && github.ref == 'refs/heads/master'
      working-directory: ${{ github.workspace }}/ci-artifacts
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "<>"
        git fetch origin process-replay || true
        git checkout process-replay 2>/dev/null || git checkout --orphan process-replay
        cp ${{ github.workspace }}/openpilot/selfdrive/test/process_replay/fakedata/*.zst .
        echo "${{ github.sha }}" > ref_commit
        git add .
        git commit -m "process-replay refs for ${{ github.repository }}@${{ github.sha }}" || echo "No changes to commit"
    - name: Push refs
      if: github.repository == 'commaai/openpilot' && github.ref == 'refs/heads/master'
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
      with:
        timeout_minutes: 2
        max_attempts: 3
        command: cd ${{ github.workspace }}/ci-artifacts && git push origin process-replay --force

  simulator_driving:
    name: simulator driving
    runs-on: ${{
      (github.repository == 'commaai/openpilot') &&
      ((github.event_name != 'pull_request') ||
      (github.event.pull_request.head.repo.full_name == 'commaai/openpilot'))
      && fromJSON('["namespace-profile-amd64-8x16"]')
      || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        lfs: false
        submodules: false
    - name: Fetch model and tinygrad
      run: |
        git submodule update --init --depth 1 tinygrad_repo
        git config lfs.url https://gitlab.com/commaai/openpilot-lfs.git/info/lfs
        git lfs pull --include="openpilot/selfdrive/modeld/models/driving_supercombo.onnx" --exclude=""
    - run: ./tools/op.sh setup
    - name: Install CPU runtime and MetaDrive
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        uv pip install onnx onnxruntime opencv-python-headless
        uv pip install "metadrive-simulator @ git+https://github.com/commaai/metadrive.git@2716f55a9c7b928ce957a497a15c2c19840c08bc"
    - name: Convert FP32 model
      run: |
        python openpilot/selfdrive/modeld/convert_onnx_fp16_to_fp32.py \
          openpilot/selfdrive/modeld/models/driving_supercombo.onnx \
          /tmp/driving_supercombo_fp32.onnx
    - name: Build openpilot
      run: scons
    - name: Run one-minute real-time driving test
      timeout-minutes: 5
      env:
        BLOCK: soundd
        CI_SIM_LOGS: "1"
        EGL_PLATFORM: surfaceless
        ENCODERD_QCAM_ONLY: "1"
        METADRIVE_FLAT_TERRAIN_CARD: "1"
        METADRIVE_MAX_SPEED_KMH: "15"
        METADRIVE_NO_MSAA: "1"
        METADRIVE_NO_SHADOWS: "1"
        METADRIVE_RENDER_SCALE: "0.25"
        METADRIVE_REPORT_FPS: "1"
        METADRIVE_SIMPLE_RENDER: "1"
        METADRIVE_TEST_DURATION: "60"
        METADRIVE_TRACK_SIZE: "100"
        MIN_MODEL_RATE: "18"
        ONNX_CPU_MODEL: /tmp/driving_supercombo_fp32.onnx
        ONNX_CPU_THREADS: "2"
        RUN_METADRIVE_TEST: "1"
        SIM_CAMERA_RESOLUTION: 1928x1208
        SIM_LOG_SAVE_DIR: ${{ github.workspace }}/sim-artifacts/logs
        SIM_MANAGER_LOG: ${{ github.workspace }}/sim-artifacts/manager.log
        SIM_USE_OPENCV_YUV: "1"
      run: |
        python -m metadrive.pull_asset
        mkdir -p sim-artifacts/logs
        xvfb-run -a -s "-screen 0 1920x1080x24" \
          python tools/test_runner.py openpilot/tools/sim/tests/test_metadrive_bridge.py -j 1 -s -v
    - name: Validate log artifacts
      if: always()
      run: |
        grep -E "locationd|modeld|commIssue|Observation" sim-artifacts/manager.log | tail -100 || true
        find sim-artifacts -type f -printf '%p %k KiB\n' | sort
        find sim-artifacts/logs -type f | grep -Eq '/(qlog|rlog)(\.zst)?$'
        find sim-artifacts/logs -type f | grep -Eq '/qcamera\.ts$'
    - name: Upload simulator artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: simulator-${{ github.run_id }}
        path: sim-artifacts

  create_ui_report:
    name: Create UI Report
    runs-on: ${{
      (github.repository == 'commaai/openpilot') &&
      ((github.event_name != 'pull_request') ||
      (github.event.pull_request.head.repo.full_name == 'commaai/openpilot'))
      && fromJSON('["namespace-profile-amd64-8x16"]')
      || fromJSON('["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v7
      - run: ./tools/op.sh setup
      - name: Build openpilot
        run: scons
      - name: Create UI Report
        env:
          RAYLIB_BACKEND: headless
        run: |
          python3 openpilot/selfdrive/ui/tests/diff/replay.py
          python3 openpilot/selfdrive/ui/tests/diff/replay.py --big
      - name: Upload UI Report
        uses: actions/upload-artifact@v7
        with:
          name: ui-report-${{ inputs.run_number || '1' }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'master' || github.event.number }}
          path: openpilot/selfdrive/ui/tests/diff/report

