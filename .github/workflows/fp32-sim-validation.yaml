name: FP32 CPU simulator validation

on:
  workflow_dispatch:
  push:
    branches:
      - benchmark/model-cpu-backends

env:
  CI: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  fp32_simulator:
    name: FP32 ONNX Runtime MetaDrive
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          submodules: false

      - name: Fetch model and tinygrad
        run: |
          git submodule update --init --depth 1 tinygrad_repo
          git config lfs.url https://gitlab.com/commaai/openpilot-lfs.git/info/lfs
          git lfs pull --include="openpilot/selfdrive/modeld/models/driving_supercombo.onnx" --exclude=""

      - run: ./tools/op.sh setup

      - name: Install CPU runtime and MetaDrive
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          uv pip install onnx onnxruntime opencv-python-headless
          uv pip install "metadrive-simulator @ git+https://github.com/commaai/metadrive.git@2716f55a9c7b928ce957a497a15c2c19840c08bc"

      - name: Convert and validate FP32 model
        run: |
          python openpilot/selfdrive/modeld/convert_onnx_fp16_to_fp32.py \
            openpilot/selfdrive/modeld/models/driving_supercombo.onnx \
            /tmp/driving_supercombo_fp32.onnx
          python openpilot/selfdrive/modeld/benchmark_cpu_backends.py \
            --model openpilot/selfdrive/modeld/models/driving_supercombo.onnx \
            --compare-model /tmp/driving_supercombo_fp32.onnx \
            --backend onnxruntime --onnxruntime-threads 2 --warmup 3 --runs 20
          python tools/test_runner.py openpilot/selfdrive/modeld/tests/test_onnx_cpu.py -j 1 -v

      - name: Build openpilot
        run: scons

      - name: Run one-minute real-time driving test
        timeout-minutes: 15
        env:
          BLOCK: soundd
          CI_SIM_LOGS: "1"
          ENCODERD_QCAM_ONLY: "1"
          SIM_LOG_SAVE_DIR: ${{ github.workspace }}/sim-artifacts/logs
          SIM_MANAGER_LOG: ${{ github.workspace }}/sim-artifacts/manager.log
          RUN_METADRIVE_TEST: "1"
          METADRIVE_TEST_DURATION: "60"
          MIN_MODEL_RATE: "18"
          # Keep the performance validation on a long straight. Curved-track
          # behavior is a separate model/control validation from CPU throughput.
          METADRIVE_TRACK_SIZE: "2000"
          METADRIVE_STRAIGHT_ONLY: "1"
          METADRIVE_FIXED_STRAIGHT_CONTROLS: "1"
          METADRIVE_FIXED_THROTTLE: "0"
          METADRIVE_MAX_SPEED_KMH: "60"
          ONNX_CPU_MODEL: /tmp/driving_supercombo_fp32.onnx
          ONNX_CPU_THREADS: "2"
          SIM_CAMERA_RESOLUTION: 1928x1208
          SIM_USE_OPENCV_YUV: "1"
          METADRIVE_RENDER_SCALE: "0.25"
          METADRIVE_NO_MSAA: "1"
          METADRIVE_NO_SHADOWS: "1"
          METADRIVE_SIMPLE_RENDER: "1"
          METADRIVE_FLAT_TERRAIN_CARD: "1"
          METADRIVE_REPORT_FPS: "1"
        run: |
          python -m metadrive.pull_asset
          mkdir -p sim-artifacts/logs
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            python tools/test_runner.py openpilot/tools/sim/tests/test_metadrive_bridge.py -j 1 -s -v

      - name: Validate log artifacts
        if: always()
        run: |
          grep -E "locationd|modeld|commIssue|Observation" sim-artifacts/manager.log | tail -100 || true
          find sim-artifacts -type f -printf '%p %k KiB\n' | sort
          find sim-artifacts/logs -type f | grep -Eq '/(qlog|rlog)(\.zst)?$'
          find sim-artifacts/logs -type f | grep -Eq '/qcamera\.ts$'

      - name: Upload simulator artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fp32-simulator-${{ github.run_number }}
          path: sim-artifacts
