[env]
# alfred checks the commit out on the UP and pushes it to the same path on the DUT
TEST_DIR = "/data/ci/tree/openpilot"
UV_CACHE_DIR = "/data/uv_cache"
UV_TOOL_DIR = "/data/uv_tools"

[jobs.onroad]
runs-on = "up-can"
dut-checkout = true
timeout-minutes = 35
steps = [
  { name = "Prepare DUT and checkout", run = "bash openpilot/selfdrive/test/ci.sh setup" },
  { name = "Build openpilot", run = "bash openpilot/selfdrive/test/ci.sh run 2100 'cd openpilot/system/manager && ./build.py'" },
  { name = "Check dirty", run = "bash openpilot/selfdrive/test/ci.sh run 2100 'tools/release/check-dirty.sh'" },
  { name = "Onroad tests", run = "bash openpilot/selfdrive/test/ci.sh can 60 './openpilot/selfdrive/test/test_onroad.py TestOnroad'" },
]

[jobs.hardware]
runs-on = "up-mici"
dut-checkout = true
timeout-minutes = 35
steps = [
  { name = "Prepare DUT and checkout", run = "bash openpilot/selfdrive/test/ci.sh setup" },
  { name = "Build openpilot", run = "bash openpilot/selfdrive/test/ci.sh run 2100 'cd openpilot/system/manager && ./build.py'" },
  { name = "Encoder", run = "bash openpilot/selfdrive/test/ci.sh run 2100 './openpilot/system/loggerd/tests/test_encoder.py'" },
  { name = "Manager", run = "bash openpilot/selfdrive/test/ci.sh run 2100 './openpilot/system/manager/test/test_manager.py'" },
]

