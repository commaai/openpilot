[env]
PYTHONPATH = "/data/ci/tree/openpilot"  # the tree
TERM = "xterm-256color"
PYTHONWARNINGS = "error"
PYTHONFAULTHANDLER = "1"
COMMA_CACHE = "/data/tmp/comma_download_cache"
# as launch_env.sh sets for openpilot on a device
OMP_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
NUMEXPR_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
VECLIB_MAXIMUM_THREADS = "1"
QCOM_PRIORITY = "12"

# with the submodule package symlinks launch_chffrplus.sh makes
[steps.build]
name = "Build openpilot"
run = """
for p in msgq_repo/msgq opendbc_repo/opendbc rednose_repo/rednose teleoprtc_repo/teleoprtc tinygrad_repo/tinygrad; do ln -sfn "$p" "${p#*/}"; done
cd openpilot/system/manager && ./build.py
"""

# jobs run on comma fours, and on a comma 3x only where it differs, like its camera sensor
[jobs.onroad]
runs-on = "up-can"
timeout-minutes = 35

[[jobs.onroad.steps]]
uses = "build"

[[jobs.onroad.steps]]
name = "Check dirty"
run = "tools/release/check-dirty.sh"

# the UP replays the CAN until the step ends
[[jobs.onroad.steps]]
name = "Onroad tests"
run = "openpilot/tools/replay/can_replay.py --up && ./openpilot/selfdrive/test/test_onroad.py TestOnroad"
timeout-minutes = 1.5

