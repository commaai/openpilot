# a UP's DUT starts each job with an empty /data: these come back from master's last good job, as it left them
cache = ["/data/scons_cache"]

[env]
PYTHONPATH = "/data/ci/tree/openpilot"  # the tree
TERM = "xterm-256color"
PYTHONWARNINGS = "error"
PYTHONFAULTHANDLER = "1"
COMMA_CACHE = "/data/tmp/comma_download_cache"
# as launch_env.sh sets for openpilot on a device
OMP_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
NUMEXPR_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
VECLIB_MAXIMUM_THREADS = "1"
QCOM_PRIORITY = "12"

# with the submodule package symlinks launch_chffrplus.sh makes
[steps.build]
name = "Build openpilot"
run = """
for p in msgq_repo/msgq opendbc_repo/opendbc rednose_repo/rednose teleoprtc_repo/teleoprtc tinygrad_repo/tinygrad; do ln -sfn "$p" "${p#*/}"; done
tools/op.sh build
"""

[steps.flash-chestnut]
name = "Flash Chestnut"
run = "sudo python3 openpilot/system/hardware/chestnut/flash.py"

# jobs run on comma fours, and on a comma 3x only where it differs, like its camera sensor
[jobs.onroad]
runs-on = "up-can"
timeout-minutes = 35

[[jobs.onroad.steps]]
uses = "build"

[[jobs.onroad.steps]]
name = "Check dirty"
run = "tools/release/check-dirty.sh"

# the UP replays the CAN until the step ends
[[jobs.onroad.steps]]
name = "Onroad tests"
run = "openpilot/tools/replay/can_replay.py --up && ./openpilot/selfdrive/test/test_onroad.py TestOnroad"
timeout-minutes = 1.5

[jobs.hardware]
runs-on = "up-mici"
timeout-minutes = 35

[[jobs.hardware.steps]]
uses = "build"

[[jobs.hardware.steps]]
name = "Encoder"
run = "./openpilot/system/loggerd/tests/test_encoder.py"

[[jobs.hardware.steps]]
name = "Manager"
run = "./openpilot/system/manager/test/test_manager.py"

[[jobs.hardware.steps]]
name = "Power draw"
run = "./openpilot/selfdrive/test/test_power_draw.py"

[jobs.replay]
runs-on = "up-mici"
timeout-minutes = 35

[[jobs.replay.steps]]
uses = "build"

[[jobs.replay.steps]]
name = "Model replay"
run = "openpilot/selfdrive/test/process_replay/model_replay.py"

[jobs.pandad]
runs-on = "up-mici"
timeout-minutes = 35

[[jobs.pandad.steps]]
uses = "build"

[[jobs.pandad.steps]]
name = "Pandad"
run = "./openpilot/selfdrive/pandad/tests/test_pandad.py"

[[jobs.pandad.steps]]
name = "Pandad loopback"
run = "./openpilot/selfdrive/pandad/tests/test_pandad_loopback.py"

[[jobs.pandad.steps]]
name = "Pandad SPI"
run = "./openpilot/selfdrive/pandad/tests/test_pandad_spi.py"

[jobs.camerad]
runs-on = "up-mici"  # TODO: re-enable up-tres
timeout-minutes = 35

[[jobs.camerad.steps]]
uses = "build"

[[jobs.camerad.steps]]
name = "Camerad"
run = "./openpilot/system/camerad/test/test_camerad.py"
timeout-minutes = 1.5

[jobs.sensord]
runs-on = "up-mici"
timeout-minutes = 35

[[jobs.sensord.steps]]
uses = "build"

[[jobs.sensord.steps]]
name = "Sensord"
run = "./openpilot/system/sensord/tests/test_sensord.py"

# a comma four with a Chestnut on its aux port, which runs the big model
[jobs.chestnut]
runs-on = "chestnut"
timeout-minutes = 35

[[jobs.chestnut.steps]]
uses = "build"

[[jobs.chestnut.steps]]
uses = "flash-chestnut"

[[jobs.chestnut.steps]]
name = "Model replay"
run = "openpilot/selfdrive/test/process_replay/model_replay.py --chestnut"

[[jobs.chestnut.steps]]
name = "Onroad tests"
run = "./openpilot/selfdrive/test/test_onroad.py TestChestnutOnroad"
timeout-minutes = 2

[steps.release]
name = "Build and test the release"
run = """
trap 'rm -rf /data/gitkey /data/pandaextra' EXIT
printf '%s\n' "$RELEASE_KEY" > /data/gitkey && chmod 600 /data/gitkey
mkdir -p /data/pandaextra/certs && printf '%s\n' "$PANDA_RELEASE_KEY" > /data/pandaextra/certs/release
unset RELEASE_KEY PANDA_RELEASE_KEY
export GIT_SSH_COMMAND="ssh -i /data/gitkey -o StrictHostKeyChecking=accept-new"
git config remote.origin.url git@github.com:commaai/openpilot.git
if [ -n "${UP_REMOTE:-}" ]; then openpilot/tools/replay/can_replay.py --up; fi
tools/release/build_release.sh $RELEASE_TESTS
"""

[jobs.nightly]
runs-on = "up-can"
timeout-minutes = 90
push = ["nightly"]
env = { RELEASE_TESTS = "TestOnroad" }
steps = [{ uses = "build" }, { uses = "release" }]

[jobs.nightly-dev]
runs-on = "up-can"
timeout-minutes = 90
push = ["nightly-dev"]
env = { RELEASE_TESTS = "TestOnroad", PANDA_DEBUG_BUILD = "1" }
steps = [{ uses = "build" }, { uses = "release" }]

[jobs.release-staging]
runs-on = "up-can"
timeout-minutes = 90
push = ["release-tizi-staging", "release-mici-staging"]
env = { RELEASE_TESTS = "TestOnroad" }
steps = [{ uses = "build" }, { uses = "release" }]

[jobs.nightly-chestnut]
runs-on = "chestnut"
timeout-minutes = 150
push = ["nightly-chestnut"]
env = { RELEASE_TESTS = "TestChestnutOnroad TestChestnutDrive", INCLUDE_BIG_MODEL = "1", SCONSFLAGS = "-j4" }
steps = [{ uses = "build" }, { uses = "flash-chestnut" }, { uses = "release" }]

[jobs.nightly-chestnut-dev]
runs-on = "chestnut"
timeout-minutes = 90
push = ["nightly-chestnut-dev"]
env = { RELEASE_TESTS = "TestChestnutOnroad", INCLUDE_BIG_MODEL = "1", SCONSFLAGS = "-j4", PANDA_DEBUG_BUILD = "1" }
steps = [{ uses = "build" }, { uses = "flash-chestnut" }, { uses = "release" }]
