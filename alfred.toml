  { name = "Pandad", run = "bash openpilot/selfdrive/test/ci.sh run 2100 './openpilot/selfdrive/pandad/tests/test_pandad.py'" },
  { name = "Camerad", run = "bash openpilot/selfdrive/test/ci.sh run 90 './openpilot/system/camerad/test/test_camerad.py'" },
]

