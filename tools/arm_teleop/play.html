<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sisyphus Toss · Leader control</title>
<style>
:root{color-scheme:dark;font:16px/1.45 Inter,system-ui,sans-serif;background:#101214;color:#f0f3f5}
*{box-sizing:border-box}main{max-width:720px;margin:5vh auto;padding:20px}h1{font-size:clamp(25px,5vw,38px);letter-spacing:-.04em;margin:0 0 4px}p{margin:6px 0 18px;color:#bac0c5}select,button{font:inherit;padding:10px 16px;border-radius:6px;border:1px solid #657077;background:#191d21;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}#follow{background:#94eac1;color:#082b1a;border-color:transparent;font-weight:650}section{display:flex;align-items:center;flex-wrap:wrap;gap:10px}output{display:block;margin:20px 0 6px;font-size:21px;font-weight:600}output.on{color:#94eac1}img{width:100%;border-radius:8px;margin-top:16px}small{color:#adb6bc}#error{color:#ffb1ae}a{color:inherit}footer{margin-top:18px}
</style>
<main>
<h1>Sisyphus Toss</h1>
<p id="slot">Checking reservation…</p>
<section><label for="arm">Follower arm</label><select id="arm" disabled><option value="left">Left</option><option value="middle">Middle</option><option value="right">Right</option></select>
<button id="follow" disabled>Start following</button><button id="pause" disabled>Pause</button></section>
<output id="control" aria-live="polite">Connecting…</output><small id="leader"></small><div id="error" role="alert"></div>
<img id="camera" hidden alt="Live view of the three arms">
<footer><small>Space or Esc pauses. Pause before switching arms. <a href="/">Full controls</a></small></footer>
</main>
<script>
const el=id=>document.getElementById(id);
const clock=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'});
let ws,active=false,showVideo=false;
function send(op,extra={}){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({op,...extra}));}
function pause(){if(active)send('stop');}
function render(s){
  const r=s.reservation||{}, phase=r.phase, arm=s.device.arms?.[s.follower], live=phase==='active', camera=s.device.camera;
  const ready=live&&!s.device_error&&arm?.connected&&!arm.error&&s.leader.connected&&camera?.age!=null&&camera.age<1;
  const phases={scheduled:'Scheduled',active:'Slot active',ended:'Slot ended',cancelled:'Cancelled'};
  el('slot').textContent=phase?'@'+r.github_username+' · '+clock.format(r.start*1000)+' – '+clock.format(r.end*1000)+' · '+phases[phase]:'Checking reservation…';
  active=s.active&&live;
  el('control').textContent=active?'Control active · '+s.follower+' arm following':live?(ready?'Control paused · ready to start':'Control paused · waiting for connection'):'Control inactive';
  el('control').classList.toggle('on',active);
  el('control').title=s.note;
  el('leader').textContent=(s.leader.connected?'Table leader connected':s.leader.error||'Waiting for table leader')+(live&&arm?' · '+s.follower+' follower '+(arm.connected?'connected':'offline'):'');
  el('arm').value=s.follower;el('arm').disabled=active||!['active','scheduled'].includes(phase);el('follow').disabled=!ready||active;el('pause').disabled=!active;
  if(live!==showVideo){showVideo=live;el('camera').hidden=!live;if(live)el('camera').src='/video';else el('camera').removeAttribute('src');}
}
function connect(){
  ws=new WebSocket('ws://'+location.host+'/ws');
  ws.onmessage=e=>{const msg=JSON.parse(e.data);if(msg.type==='state')render(msg);else if(msg.type==='error')el('error').textContent=msg.message;};
  ws.onclose=()=>{active=false;el('control').textContent='Disconnected · control inactive';el('control').classList.remove('on');for(const id of ['arm','follow','pause'])el(id).disabled=true;setTimeout(connect,1000);};
}
el('camera').onerror=()=>setTimeout(()=>{if(showVideo)el('camera').src='/video?t='+Date.now();},1000);
el('arm').onchange=()=>{el('error').textContent='';send('select',{arm:el('arm').value});};
el('follow').onclick=()=>{el('error').textContent='';send('start');};
el('pause').onclick=pause;window.addEventListener('blur',pause);window.addEventListener('pagehide',pause);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.addEventListener('keydown',e=>{if(e.code==='Escape'||(e.code==='Space'&&active)){e.preventDefault();pause();}});
setInterval(()=>{if(!document.hidden)send('heartbeat');},100);connect();
</script>
</html>
