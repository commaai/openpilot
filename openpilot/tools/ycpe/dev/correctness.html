<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ycpe correctness panes</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { display: flex; flex-direction: column; height: 100vh; margin: 0; }
    #bar { display: flex; gap: 8px; align-items: center; padding: 6px; }
    #pane { flex: 1; min-height: 0; }
  </style>
</head>
<body>
  <div id="bar">?pane=logs|inspector&amp;rows=&amp;segs=&amp;route= (no route: a fake store) <button id="play">play 5×</button> <span id="time"></span></div>
  <div id="pane"></div>
  <script type="module">
    import {createClock} from "/clock.js";
    import {perf} from "/perf.js";
    import {theme} from "/theme.js";
    import {api} from "/api.js";
    import {Store} from "/data/store.js";

    const q = new URLSearchParams(location.search);
    const kind = q.get("pane") || "logs", rows = +q.get("rows") || 100000, segs = +q.get("segs") || 4;

    // a fake store of swaglog lines, a segment every 300 ms, for driving the panes at volume
    function fakeStore() {
      const handlers = {}, chunks = [];
      const store = {
        route: {segments: Array.from({length: segs}, (_, n) => ({n, status: "queued"}))},
        on(ev, fn) { (handlers[ev] ||= new Set()).add(fn); return () => handlers[ev].delete(fn); },
        series: (path) => path === "/logMessage" ? {path, type: "t", chunks} : null,
        message: () => null,
      };
      let n = 0;
      const timer = setInterval(() => {
        if (n === segs) return clearInterval(timer);
        const t = Float64Array.from({length: rows}, (_, k) => n * 60 + k * 60 / rows);
        const v = Array.from(t, (x, k) => JSON.stringify({levelnum: 10 * (1 + k % 5), ctx: {daemon: ["controlsd", "plannerd", "ui", "pandad"][k % 4]}, msg: `line ${k} at ${x.toFixed(3)}`}));
        chunks.push({n, t, v, tt: t});
        store.route.segments[n].status = "done";
        for (const fn of handlers.segment || []) fn(n++);
      }, 300);
      return store;
    }

    let store, duration = segs * 60;
    if (q.get("route")) {
      const name = q.get("route"), files = await api.routeFiles(name);
      const urls = [];
      for (const u of [...(files.qlogs || []), ...(files.logs || [])]) urls[+new URL(u).pathname.split("/").at(-2)] = u;
      store = new Store(name, urls, {t: 0});
      duration = urls.length * 60;
    } else {
      store = fakeStore();
    }
    window.store = store;

    const clock = window.clock = createClock(duration);
    const ctx = {route: {}, clock, perf, theme, store, peekStore: () => store, onStore: (fn) => fn(store), layout: null, openRoute() {}};
    const {create} = await import(`/panes/${kind}.js`);
    const pane = window.pane = create(ctx, {});
    const host = document.getElementById("pane");
    host.append(pane.el);
    new ResizeObserver(([e]) => pane.resize(e.contentRect.width, e.contentRect.height)).observe(host);
    clock.on("t", () => { document.getElementById("time").textContent = clock.t.toFixed(2); });
    document.getElementById("play").onclick = () => { clock.setRate(5); clock.toggle(); };
  </script>
</body>
</html>
