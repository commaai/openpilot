<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ycpe panda</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { background: var(--bg); color: var(--fg); font: 13px monospace; margin: 12px; }
    #bar { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
    table { border-collapse: collapse; }
    td, th { padding: 1px 10px 1px 0; text-align: left; white-space: pre; }
    td:nth-child(3), td:nth-child(4) { text-align: right; }
  </style>
</head>
<body>
  <div>panda over WebUSB, receive only · ?fake-panda replays the demo route (?fake-panda=click: not yet granted)</div>
  <div id="bar">
    <span id="hud"></span>
    <b id="state"></b>
    <span id="detail"></span>
    <button id="connect" hidden>Connect panda</button>
    <button id="stop">Stop</button>
  </div>
  <pre id="stats"></pre>
  <table>
    <thead><tr><th>bus:address</th><th>data</th><th>count</th><th>Hz</th></tr></thead>
    <tbody id="msgs"></tbody>
  </table>
  <script type="module">
    import {h} from "/dom.js";
    import {hud, perf} from "/perf.js";
    import {create} from "/data/live/panda.js";
    import {fakeUsb} from "/data/live/fake-panda.js";

    const q = new URLSearchParams(location.search);
    const $ = (id) => document.getElementById(id);
    $("hud").append(hud());

    // the fake is made here rather than by panda.js, to read when its packets "arrived"
    const fake = window.fake = q.has("fake-panda") ? await fakeUsb({granted: q.get("fake-panda") !== "click"}) : null;
    const source = window.source = create(fake ? {usb: fake} : {});
    const worker = new Worker(new URL("./panda-worker.js", import.meta.url), {type: "module"});

    // window.bench: what the harness reads. usb: packet arrival → event (fake only); screen: event → the frame showing it
    const bench = window.bench = {usb: [], screen: [], events: 0, start: performance.now()};
    const keep = (a, v) => { a.push(v); if (a.length > 1000) a.shift(); };

    let pending = [], newest = 0;
    worker.onmessage = ({data}) => {
      pending.push(...data.rows);
      newest = Math.max(newest, data.t * 1000);
      perf.invalidate(table);
    };

    const rows = new Map();
    const table = {name: "panda-table", el: $("msgs"), render() {
      let added = false;
      for (const [key, count, hz, hex] of pending) {
        let r = rows.get(key);
        if (!r) {
          const name = `${Math.floor(key / 2 ** 32)}:${(key % 2 ** 32).toString(16)}`;
          rows.set(key, r = {key, tr: h("tr"), cells: [h("td", {}, name), h("td"), h("td"), h("td")]});
          r.tr.append(...r.cells);
          added = true;
        }
        r.cells[1].textContent = hex.replace(/(..)/g, "$1 ");
        r.cells[2].textContent = count;
        r.cells[3].textContent = hz.toFixed(1);
      }
      pending = [];
      if (added) {
        const sorted = [...rows.values()].sort((a, b) => a.key - b.key);
        $("msgs").replaceChildren(...sorted.map((r) => r.tr));
      }
      if (newest) keep(bench.screen, performance.now() - newest);
    }};

    const sink = {events(bytes) {
      bench.events++;
      if (fake) keep(bench.usb, performance.now() - fake.device.arrival);
      worker.postMessage(bytes, [bytes.buffer]);
    }};

    const pct = (a, p) => a.length ? [...a].sort((x, y) => x - y)[Math.min(a.length - 1, Math.floor(a.length * p))].toFixed(1) : "-";
    const showState = () => {
      $("state").textContent = source.state;
      $("detail").textContent = source.detail;
      $("connect").hidden = source.state !== "connecting" || /opening/.test(source.detail);
    };
    source.on("state", showState);
    $("connect").onclick = () => source.connect();
    $("stop").onclick = () => source.stop();

    let last = {frames: 0, busyMs: 0, t: performance.now()};
    setInterval(() => {
      const s = source.stats, now = performance.now(), dt = (now - last.t) / 1000, ps = s.health;
      $("stats").textContent = [
        `${((s.frames - last.frames) / dt).toFixed(0)} frames/s · ${s.events} events · ${(s.bytes / 1e6).toFixed(1)} MB · ` +
          `${s.checksumErrors} checksum errors · ${s.overflows} overflows · busy ${((s.busyMs - last.busyMs) / dt).toFixed(1)} ms/s`,
        `latency ms (p50 / p95 / max): ${fake ? `usb → event ${pct(bench.usb, 0.5)} / ${pct(bench.usb, 0.95)} / ${pct(bench.usb, 1)} · ` : ""}` +
          `event → screen ${pct(bench.screen, 0.5)} / ${pct(bench.screen, 0.95)} / ${pct(bench.screen, 1)}`,
        ps ? `${ps.voltage / 1000} V · ${ps.current} mA · ignition ${ps.ignitionLine || ps.ignitionCan} · safety ${ps.safetyModel} · ` +
          `uptime ${ps.uptime} s · bus 0 ${ps.canState0.canSpeed} kbps, ${ps.canState0.totalRxCnt} rx` : "no health yet",
      ].join("\n");
      last = {frames: s.frames, busyMs: s.busyMs, t: now};
    }, 1000);

    showState();
    await source.start(sink);
    showState();
  </script>
</body>
</html>
