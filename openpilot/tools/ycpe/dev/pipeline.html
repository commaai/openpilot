<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ycpe pipeline</title>
  <style>
    body { background: #111; color: #ddd; font: 13px monospace; margin: 16px; }
    canvas { display: block; width: 100%; background: #1a1a1a; margin: 12px 0; }
    #segs { height: 12px; } #plot { height: 240px; }
  </style>
</head>
<body>
  <div>route <b id="route"></b> · ?route=&amp;repeat=&amp;t=&amp;path=</div>
  <canvas id="segs"></canvas>
  <pre id="stats"></pre>
  <canvas id="plot"></canvas>
  <script type="module">
    import {openRoute} from "../data/store.js";

    const q = new URLSearchParams(location.search);
    const name = q.get("route") || "5beb9b58bd12b691|0000010a--a51155e496";
    const path = q.get("path") || "/carState/vEgo";
    const focus = +(q.get("t") || 0);
    const $ = (id) => document.getElementById(id);
    $("route").textContent = name;

    const t0 = performance.now();
    const store = window.store = await openRoute(name, {t: focus, repeat: +(q.get("repeat") || 1)});
    // window.bench: what the harness reads
    const bench = window.bench = {start: t0, first: null, focus: null, done: null, drops: 0, longest: 0, decimateMs: 0, gaps: []};
    const focusSeg = Math.floor(focus / 60);
    const mb = (b) => (b / 1e6).toFixed(1);
    const ms = () => Math.round(performance.now() - t0);

    // dropped frames while loading, from rAF intervals
    let last = performance.now();
    requestAnimationFrame(function frame(now) {
      const dt = now - last;
      last = now;
      if (bench.done === null) {
        if (dt > 25) bench.drops += Math.round(dt / (1000 / 60)) - 1;
        bench.longest = Math.max(bench.longest, dt);
        if (dt > 50) bench.gaps.push([ms(), Math.round(dt)]);
      }
      requestAnimationFrame(frame);
    });

    const COLORS = {queued: "#333", missing: "#222", done: "#4a4", error: "#a44"};
    function draw() {
      const {segments, duration} = store.route;
      const sc = $("segs"), sw = sc.width = sc.clientWidth, sx = sc.getContext("2d");
      sc.height = 12;
      segments.forEach((s, i) => {
        sx.fillStyle = COLORS[s.status];
        sx.fillRect(i * sw / segments.length, 0, Math.max(1, sw / segments.length - 1), 12);
      });

      const p = store.progress, s = (performance.now() - t0) / 1000, per = (k) => (p.ms[k] / Math.max(1, p.done)).toFixed(0);
      $("stats").textContent = [
        `segments ${p.done}/${p.total} failed ${p.failed} cached ${p.cached} · ${s.toFixed(2)} s · ${(p.done / s).toFixed(1)} seg/s`,
        `first segment ${bench.first ?? "-"} ms · focus segment ${bench.focus ?? "-"} ms · complete ${bench.done ?? "-"} ms`,
        `fetched ${mb(p.bytes)} MB (${mb(p.bytes / s)} MB/s) raw ${mb(p.raw)} MB · per segment: fetch ${per("fetch")} decompress ${per("decompress")} read ${per("read")} ms · main-thread ingest ${per("ingest")} ms (max ${p.ingestMax.toFixed(1)})`,
        `${store.paths().length} paths · resident ${mb(store.bytes)} MB (${mb(store.bytes / Math.max(1, p.done))} MB/segment) · workers ${store.loader.workers.length} · pending ${store.loader.pending}`,
        `dropped frames ${bench.drops} · longest frame ${bench.longest.toFixed(0)} ms · decimate ${bench.decimateMs.toFixed(2)} ms · draw max ${(bench.drawMax || 0).toFixed(1)} ms`,
      ].join("\n");

      const c = $("plot"), w = c.width = c.clientWidth * devicePixelRatio, h = c.height = c.clientHeight * devicePixelRatio;
      const ctx = c.getContext("2d");
      const d0 = performance.now();
      const d = store.decimate(path, 0, duration, w);
      bench.decimateMs = performance.now() - d0;
      bench.drawMax = Math.max(bench.drawMax || 0, performance.now() - d0);
      if (!d) return;
      let lo = Infinity, hi = -Infinity;
      for (let i = 0; i < d.t.length; i++) if (d.min[i] === d.min[i]) { lo = Math.min(lo, d.min[i]); hi = Math.max(hi, d.max[i]); }
      const x = (t) => t / duration * w, y = (v) => h - 4 - (v - lo) / (hi - lo || 1) * (h - 8);
      ctx.strokeStyle = "#5af";
      ctx.beginPath();
      for (let i = 0; i < d.t.length; i++) {
        if (d.min[i] !== d.min[i]) continue;
        ctx.moveTo(x(d.t[i]), y(d.min[i]));
        ctx.lineTo(x(d.t[i]), y(d.max[i]) - 1);
      }
      ctx.stroke();
      ctx.fillStyle = "#888";
      ctx.fillText(`${path} [${lo.toFixed(2)}, ${hi.toFixed(2)}] · valueAt(60) = ${store.valueAt(path, 60)}`, 6, 14);
    }

    let queued = false;
    const redraw = () => queued || (queued = requestAnimationFrame(() => { queued = false; draw(); }));
    store.on("segment", (n) => {
      bench.first ??= ms();
      if (n === focusSeg) bench.focus ??= ms();
      redraw();
    });
    store.on("progress", (p) => {
      if (p.done + p.failed === p.total) bench.done ??= ms();
      redraw();
    });
    redraw();
  </script>
</body>
</html>
