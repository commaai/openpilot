  <meta name="apple-mobile-web-app-title" content="ycpe">
  <script>
    // the mode the page will open in (pages/connect/mode.js), so the bar holding its place is that mode's size, and
    // user mode (connect's, dark only: theme.js) never paints in the light theme first
    const root = document.documentElement;
    root.dataset.mode = /^\/connect(\/|$)/.test(location.pathname) || localStorage.getItem("ycpe_mode") !== "dev" &&
      /^\/(([0-9a-f]{16})(\/[^/]+)?|account|referrals)?\/?$/i.test(location.pathname) && !location.search.includes("url=") ? "user" : "dev";
    root.dataset.theme = root.dataset.mode === "user" ? "dark" : localStorage.getItem("ycpe_theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
